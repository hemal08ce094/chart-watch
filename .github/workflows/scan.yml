name: Chart scan

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours (UTC); GitHub may start scheduled runs a few minutes late
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: chart-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan App Store charts
        env:
          SCHEDULE_LABEL: every 2 hours
        run: python3 server.py --once

      - name: Save results to the repo
        run: |
          git config user.name "chart-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json web/status.json
          git diff --cached --quiet && exit 0
          git commit -m "Chart scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1

  # Publishes the dashboard to GitHub Pages. Runs only once Pages is turned on
  # (Settings → Pages → Source: GitHub Actions) and the repo variable PAGES_ENABLED is "true".
  publish:
    needs: scan
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
